# 変更履歴: 2026-11-11 新ドメインからの簡易チェックを許可。
# 変更履歴: 2026-11-08 「かんたん安全チェック」APIのCloudflare Workers設定を追加。
name = "web-no-tonari-safety-check"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# 変更履歴: 2026-11-08 同一アカウントのWorker（自社サイト）も公開インターネット経由で確認するため追加。
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://site-veil.com,https://www.site-veil.com,https://web-no-tonari.amaretto.workers.dev,https://lifecastingtimecapsule.github.io,http://127.0.0.1:4321,http://localhost:4321"
