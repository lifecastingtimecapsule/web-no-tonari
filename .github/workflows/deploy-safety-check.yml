# 変更履歴: 2026-11-08 安全チェックのWorkerを、main更新時にCloudflareへ公開するワークフローを追加。
# 必要な設定: リポジトリのSecretsに CLOUDFLARE_API_TOKEN（Workers編集権限）と CLOUDFLARE_ACCOUNT_ID。
name: Deploy safety-check Worker

on:
  push:
    branches: [main]
    paths: ['workers/safety-check/**', '.github/workflows/deploy-safety-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/safety-check.test.ts
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/safety-check
