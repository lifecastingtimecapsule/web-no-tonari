# 変更履歴: 2026-11-08 サイト本体をCloudflare Workers（静的アセット）へ公開するワークフローを追加。
# 必要な設定: Secretsの CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID（安全チェックと共通）。
# 独自ドメインへ移るときは SITE_URL を変更する。
name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://web-no-tonari.amaretto.workers.dev
          BASE_PATH: /
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/site
