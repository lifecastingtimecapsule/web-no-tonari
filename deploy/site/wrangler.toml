# 変更履歴: 2026-11-08 サイト本体をCloudflare Workers（静的アセット）で配信する設定を追加。
# 変更履歴: 2026-11-08 http://をhttps://へ転送するため、アセットより先に入口のスクリプトを通す設定へ変更。
# ビルドは SITE_URL・BASE_PATH=/ を指定した dist を配信する。保護ヘッダーは public/_headers で付与する。
name = "web-no-tonari"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

# 変更履歴: 2026-11-11 取得済みのsite-veil.comへ接続。
[[routes]]
pattern = "site-veil.com"
custom_domain = true

[[routes]]
pattern = "www.site-veil.com"
custom_domain = true

# 変更履歴: 2026-11-11 問い合わせの連続送信を拠点ごとに制限。RESEND_API_KEYはWorkerのSecretで設定する。
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "876511"
simple = { limit = 3, period = 60 }

# 変更履歴: 2026-11-11 公開メール照会の乱用を制限。個人別の照会結果は保存しない。
[[ratelimits]]
name = "BREACH_RATE_LIMITER"
namespace_id = "876512"
simple = { limit = 3, period = 60 }

[[durable_objects.bindings]]
name = "BREACH_BUDGET"
class_name = "BreachBudget"

[[migrations]]
tag = "breach-budget-v1"
new_sqlite_classes = ["BreachBudget"]

# 個人情報を含み得る上流URL・本文のトレース／ログを有効化しない。
[observability]
enabled = false
